name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # The toolchain pinned in rust-toolchain.toml (its components with it).
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Bevy system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The fast tier (DEC-16): every test but the per-level checks, which are ignored by
      # default (the test profile: optimized, with debug assertions and overflow checks).
      - name: Test
        run: cargo test --workspace

  # T11 across platforms (PHYSICS.md §9): the golden hashes are committed from Windows;
  # here one level per feature is flown on Linux and must hash alike, bit for bit
  # (charges, box electrodes, ferrites, finite c, drives, beams, radiation reaction, free
  # particles, metal spheres, clouds, radiation goals, waves, vacuum and metal tubes, a
  # transistor circuit).
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Golden hashes, one level per feature
        run: |
          failed=0
          for level in 25_beam_pipe 30_ferrite_shield 39_rf_kick 52_induction_kick \
              55_space_charge 57_relativistic_beam 68_throw_a_charge 76_jackson_own_image \
              85_jackson_bound_charge 89_jackson_beaming 93_jackson_thomson 100_sideways \
              109_ohms_law 119_laminations 122_inverter; do
            cargo test --release -p level --test per_level -- --ignored --exact "golden::$level" || failed=1
          done
          exit $failed

  # The scripts (DEC-21): their type checks (mypy.ini) and tests (pytest.ini).
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Tools
        run: python -m pip install mypy pytest
      - name: Type checks
        run: python -m mypy
      - name: Tests
        run: python -m pytest

  # The dependencies' licences, advisories and sources (deny.toml), unused dependencies, and
  # the documentation's links (DEC-17).
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Bevy system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: Unused dependencies
        run: cargo machete
      - name: Documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
