# cargo-deny (docs/DECISIONS.md, DEC-17): the dependencies' licences, security advisories and
# sources, checked in CI. Every ignored advisory carries its reason; review them when Bevy is
# upgraded.

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0344", reason = "ruzstd 0.8 via bevy_image (the fix needs 0.9.1, a Bevy upgrade); its decompression bomb needs crafted input, and the game decodes only its own bundled assets" },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained: a transitive proc macro of Bevy and wgpu, for upstream to replace" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is unmaintained: Bevy's text shaping, for upstream to replace" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained: the fonts of egui and Bevy, for upstream to replace" },
]

[licenses]
# Permissive licences only (the project is MIT OR Apache-2.0); crates offered under several
# licences pass on any one of these.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Bevy's tree carries many crates in several versions; not ours to unify.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
