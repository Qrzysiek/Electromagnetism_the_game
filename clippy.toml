# The authoritative trajectory path (crates physics and level) must be bit-identical on
# every platform (CLAUDE.md, PHYSICS.md §9, test T11). The standard library's elementary
# functions call the platform's C library, whose results differ in the last bit between
# Windows and Linux (the golden hashes differed on CI, level 8: `atan2` in an acceptance
# margin). Use the pure-Rust `libm` crate (musl's implementations) there instead. Crates
# and tests outside that path (the game's pictures, test references) opt out with
# `#![allow(clippy::disallowed_methods)]`.
disallowed-methods = [
    { path = "f64::sin", reason = "platform libm; use libm::sin" },
    { path = "f64::cos", reason = "platform libm; use libm::cos" },
    { path = "f64::tan", reason = "platform libm; use libm::tan" },
    { path = "f64::sin_cos", reason = "platform libm; use libm::sincos" },
    { path = "f64::asin", reason = "platform libm; use libm::asin" },
    { path = "f64::acos", reason = "platform libm; use libm::acos" },
    { path = "f64::atan", reason = "platform libm; use libm::atan" },
    { path = "f64::atan2", reason = "platform libm; use libm::atan2" },
    { path = "f64::sinh", reason = "platform libm; use libm::sinh" },
    { path = "f64::cosh", reason = "platform libm; use libm::cosh" },
    { path = "f64::tanh", reason = "platform libm; use libm::tanh" },
    { path = "f64::asinh", reason = "platform libm; use libm::asinh" },
    { path = "f64::acosh", reason = "platform libm; use libm::acosh" },
    { path = "f64::atanh", reason = "platform libm; use libm::atanh" },
    { path = "f64::exp", reason = "platform libm; use libm::exp" },
    { path = "f64::exp2", reason = "platform libm; use libm::exp2" },
    { path = "f64::exp_m1", reason = "platform libm; use libm::expm1" },
    { path = "f64::ln", reason = "platform libm; use libm::log" },
    { path = "f64::log", reason = "platform libm; use libm::log / libm::log" },
    { path = "f64::log2", reason = "platform libm; use libm::log2" },
    { path = "f64::log10", reason = "platform libm; use libm::log10" },
    { path = "f64::ln_1p", reason = "platform libm; use libm::log1p" },
    { path = "f64::powf", reason = "platform libm; use libm::pow" },
    { path = "f64::cbrt", reason = "platform libm; use libm::cbrt" },
    { path = "f64::hypot", reason = "platform libm; use libm::hypot" },
]
