[package]
name = "game"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
physics = { path = "../physics" }
level = { path = "../level" }
# The elementary functions of the materials' ratios (scales.rs; clippy.toml forbids std's).
libm = "0.2.16"
bevy = "0.19.1"
bevy_egui = "0.42.0"
# Rasterizes the MathJax-rendered formulas of level texts (math.rs).
resvg = "0.45"
rayon = "1.12.0"
serde_json = "1"
# Opens a level's document (docs/levels/pdf/) with the system's PDF viewer (level_docs.rs).
opener = "0.9"
