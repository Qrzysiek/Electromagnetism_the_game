[package]
name = "level"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
physics = { path = "../physics" }
# The offline tools' run cache keys (run_cache.rs; already in the tree through the game).
blake3 = "1.8.7"
# Elementary functions bit-identical on every platform (the authoritative path).
libm = "0.2.16"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[dev-dependencies]
# The per-level checks as one test each (tests/per_level.rs, DEC-16).
libtest-mimic = "0.8.2"

[[test]]
name = "per_level"
harness = false
